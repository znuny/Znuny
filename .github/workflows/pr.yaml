---
name: Pull Request

# pull_request_target runs in the base repository, so secrets are available
# for pull requests from forks. This workflow does not check out pull request code.
on:
  pull_request_target:
    types: [ closed ]

jobs:
  Merged:
    # this job will only run if the PR has been merged
    # and the github.base_ref ends with a 'dev'
    # $GITHUB_BASE_REF / github.base_ref - target branch of the pull request
    if: github.event.pull_request.merged == true && endsWith( github.base_ref, 'dev' )
    runs-on: ubuntu-latest
    env:
      CURL_TOKEN: ${{ secrets.CURL_TOKEN }}
      CURL_DATA: ${{ secrets.CURL_DATA }}
    steps:
    - run: |
        if [ -z "$CURL_TOKEN" ] || [ -z "$CURL_DATA" ]; then
          echo "CURL_TOKEN or CURL_DATA is not set."
          exit 1
        fi
        # CURL_DATA is the full curl argument list. ${CURL_TOKEN} and
        # ${GITHUB_BASE_REF} in that value are expanded here.
        if ! eval "curl $CURL_DATA"; then
          echo "Request failed."
          exit 1
        fi
