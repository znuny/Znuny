---
Debugger:
  DebugThreshold: debug
  TestMode: '0'
Description: ''
FrameworkVersion: 7.3.6
Provider:
  Transport:
    Type: ''
RemoteSystem: ''
Requester:
  Invoker:
    Escalate:
      Description: ''
      Events: []
      GetAllArticleAttachments: '0'
      MappingOutbound:
        Config:
          DataInclude: []
          ForceArray: attachments body facts actions
          PostRegExFilter:
          - Replace: \$schema
            Search: AdaptiveCardSchema
          PostRegExValueCounter: '1'
          PreRegExFilter: ~
          PreRegExValueCounter: ~
          Template: |
            <?xml version="1.0" encoding="UTF-8"?>
            <xsl:transform version="1.0" xmlns:xsl="http://www.w3.org/1999/XSL/Transform">
                <xsl:output method="xml" encoding="utf-8" indent="yes"/>
                <xsl:template match="RootElement">
                    <xsl:copy>
                        <!-- Outer envelope required by the Teams Workflow webhook -->
                        <type>message</type>
                        <attachments>
                            <contentType>application/vnd.microsoft.card.adaptive</contentType>
                            <content>
                                <!-- AdaptiveCardSchema → $schema via PostRegExFilter -->
                                <AdaptiveCardSchema>http://adaptivecards.io/schemas/adaptive-card.json</AdaptiveCardSchema>
                                <type>AdaptiveCard</type>
                                <version>1.2</version>

                                <!-- Header block -->
                                <body>
                                    <type>TextBlock</type>
                                    <text>&#x1F6A8; Ticket #<xsl:value-of select="//Ticket/TicketNumber"/>&#160;is escalated</text>
                                    <weight>bolder</weight>
                                    <size>medium</size>
                                    <wrap>true</wrap>
                                </body>

                                <!-- Fact table: Owner / State / Type -->
                                <body>
                                    <type>FactSet</type>
                                    <facts>
                                        <title>Owner</title>
                                        <value><xsl:value-of select="//Ticket/OwnerData/UserFullname"/></value>
                                    </facts>
                                    <facts>
                                        <title>State</title>
                                        <value><xsl:value-of select="//Ticket/State"/></value>
                                    </facts>
                                    <facts>
                                        <title>Type</title>
                                        <value><xsl:value-of select="//Ticket/Type"/></value>
                                    </facts>
                                </body>

                                <!-- Action button: opens ticket in Znuny -->
                                <body>
                                    <type>ActionSet</type>
                                    <actions>
                                        <type>Action.OpenUrl</type>
                                        <title>View ticket in Znuny</title>
                                        <url>&lt;OTRS_CONFIG_HttpType&gt;://&lt;OTRS_CONFIG_FQDN&gt;/&lt;OTRS_CONFIG_ScriptAlias&gt;/index.pl?Action=AgentTicketZoom;TicketID=<xsl:value-of select="//Ticket/TicketID"/></url>
                                    </actions>
                                </body>
                            </content>
                        </attachments>
                    </xsl:copy>
                </xsl:template>
            </xsl:transform>
        Type: XSLT
      Type: Ticket::Generic
  Transport:
    Config:
      AdditionalHeaders: ~
      ContentType: JSON
      DefaultCommand: POST
      Host: YOURHOOK_PART1
      InvokerControllerMapping:
        Escalate:
          Command: POST
          Controller: /YOURHOOK_PART2
      SSLNoHostnameVerification: '0'
      Timeout: '30'
    Type: HTTP::REST